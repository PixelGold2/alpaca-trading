name: Crypto Strategy

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: crypto-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest state
        run: git pull --rebase origin master || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r quant/requirements.txt

      - name: Run crypto strategy tick
        working-directory: quant
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL }}
        run: python crypto_strategy_runner.py

      - name: Save state to repo
        run: |
          git config user.name "crypto-bot"
          git config user.email "bot@alpaca.local"
          git add quant/crypto_live_state.json
          git diff --staged --quiet || git commit -m "state: crypto $(date -u '+%H:%M')"
          git push || (git pull --rebase origin master && git push)
